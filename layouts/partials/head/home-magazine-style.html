<style>
.magazine-hero,.magazine-card,.magazine-mini-card{overflow:hidden;border:1px solid var(--border-light);background:var(--surface-panel);transition:box-shadow .2s ease,transform .2s ease}
.magazine-hero:hover,.magazine-card:hover,.magazine-mini-card:hover{box-shadow:0 8px 24px var(--shadow);transform:translateY(-2px)}
.magazine-hero{margin:0 0 2rem;border-radius:8px}
.magazine-hero-link,.magazine-card-link,.magazine-mini-card>a{display:block;color:var(--text);text-decoration:none}
.magazine-hero-image,.magazine-card-image,.magazine-mini-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-chip)}
.magazine-hero-body,.magazine-card-body{display:flex;min-width:0;flex-direction:column}
.magazine-hero-body{padding:1.5rem 1.75rem 1.65rem}
.magazine-category-label{color:var(--link);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.magazine-hero-title{margin:.35rem 0 .45rem;color:var(--text-strong);font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.8rem,4vw,2.7rem);font-weight:700;line-height:1.18}
.magazine-hero-excerpt{display:-webkit-box;overflow:hidden;margin:0 0 .75rem;color:var(--text-secondary);font-size:1rem;line-height:1.6;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.magazine-date{color:var(--text-meta);font-size:.8rem}
.magazine-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;margin:0 0 2.75rem}
.magazine-card{min-width:0;border-radius:7px}
.magazine-card-body{padding:1rem}
.magazine-card-title{margin:.3rem 0 .65rem;color:var(--text);font-size:1.08rem;font-weight:650;line-height:1.4}
.magazine-card-link:hover .magazine-card-title,.magazine-mini-card a:hover span{color:var(--link)}
.magazine-card:not(.has-image) .magazine-card-body{min-height:11rem;justify-content:flex-end}
.magazine-category-strip{display:grid;gap:2.75rem;margin:0 0 3rem}
.magazine-category-section{min-width:0}
.magazine-category-header{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin:0 0 1rem;border-bottom:1px solid var(--border)}
.magazine-category-header h2{margin:0;padding:0 0 .55rem;border-bottom:3px solid var(--link);color:var(--text-strong);font-size:1.2rem}
.magazine-category-header a{padding:0 0 .55rem;color:var(--link);font-size:.82rem;text-decoration:none;white-space:nowrap}
.magazine-mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.magazine-mini-card{min-width:0;border-radius:6px}
.magazine-mini-card span{display:-webkit-box;overflow:hidden;padding:.65rem;color:var(--text);font-size:.82rem;font-weight:600;line-height:1.35;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.magazine-mini-card:not(.has-image) a{display:flex;min-height:8.5rem;align-items:flex-end}
@media(max-width:600px){.magazine-hero-body{padding:1.15rem}.magazine-hero-title{font-size:1.65rem}.magazine-grid{grid-template-columns:1fr}.magazine-mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pagination{flex-wrap:wrap;gap:.75rem}.pagination-pages{order:3;flex-basis:100%;justify-content:center;flex-wrap:wrap}}
</style>
